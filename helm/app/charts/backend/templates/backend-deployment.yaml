apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
{{ include "backend.labels" . | indent 4 }}
spec:
  {{- with .Values.deployment }}
  replicas: {{ .replicas }}
  selector:
    matchLabels:
{{ include "backend.selectorLabels" $ | indent 6 }}
  template:
    metadata:
      labels:
{{ include "backend.labels" $ | indent 8 }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres..."
              until nc -zv {{ $.Values.global.services.postgres }}.app.svc.cluster.local 5432; do
                sleep 1
              done
              echo "Postgres is up"
      containers:
        - name: {{ .name }}
          image: {{ printf "%s:%s" .image.name .image.tag }}
          imagePullPolicy: {{ .image.pullPolicy }}
          env:
            {{- range $key, $val := .env.secret }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secret.name }}
                  key: {{ $val }}
            {{- end }}
            {{- range $key, $val := .env.config }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $.Values.global.config.name }}
                  key: {{ $val }}
            {{- end }}
          {{- with .ports }}
          ports:
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
          {{- end }}
          # Переопределяем команду, чтобы НЕ запускать alembic здесь:
          command: ["sh","-c"]
          args:
            - |
              gunicorn app.main:app --workers {{ $.Values.config.GUNICORN_WORKERS }} --worker-class uvicorn.workers.UvicornWorker --bind={{ $.Values.config.GUNICORN_BIND }}
          {{- with .probes }}
          readinessProbe:
            {{- with .readiness }}
            httpGet:
              path: {{ .path }}
              port: {{ .port }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            {{- end }}
          livenessProbe:
            {{- with .liveness }}
            httpGet:
              path: {{ .path }}
              port: {{ .port }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            {{- end }}
          {{- end}}
          {{- with .resources }}
          resources:
            requests:
              cpu: {{ .requests.cpu }}
              memory: {{ .requests.memory }}
            limits:
              cpu: {{ .limits.cpu }}
              memory: {{ .limits.memory }}
          {{- end }}
  {{- end }}